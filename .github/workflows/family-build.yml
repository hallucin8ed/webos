# Builds the installable package (.ipk) of the family edition (Adult and Kids profiles) and publishes it as the "family-latest" release.
name: Build Stremio Family
on:
  push:
    branches: [kids]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      APPID: tv.stremioorigin.family
      TITLE: Stremio Family
      UPSTREAM_IPK: https://stremio-origin.github.io/webos/tv.stremioorigin.app_1.0.0_arm.ipk
      UPSTREAM_SHA: 949d4eabafb7290258eae8ad9e405e7f8f31f4c030071039258f382ca7769a42
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: LG webOS SDK (headers and libraries to link against)
        run: |
          mkdir -p /tmp/sdk-dl "$HOME/origin-build/sdk"
          gh release view -R openlgtv/buildroot-nc4 --json tagName,assets --jq '.tagName, (.assets[].name)'
          gh release download -R openlgtv/buildroot-nc4 -p 'arm-webos-linux-gnueabi_sdk-buildroot*' -D /tmp/sdk-dl
          for f in /tmp/sdk-dl/*; do tar xf "$f" -C "$HOME/origin-build/sdk"; done
          SYSROOT="$(dirname "$(dirname "$(dirname "$(find "$HOME/origin-build/sdk" -name libSDL2.so -path '*sysroot/usr/lib/*' | head -1)")")")"
          test -f "$SYSROOT/usr/lib/libSDL2.so"
          echo "SDK=$SYSROOT" >> "$GITHUB_ENV"
      - name: Torrent and sound libraries, unchanged from the original 1.0.0 release
        run: |
          mkdir -p /tmp/up build/webos && cd /tmp/up
          curl -fsSL -o up.ipk "$UPSTREAM_IPK"
          echo "$UPSTREAM_SHA  up.ipk" | sha256sum -c -
          ar x up.ipk && tar xzf data.tar.gz
          cp usr/palm/applications/tv.stremioorigin.app/libsbengine.so usr/palm/applications/tv.stremioorigin.app/libsbdts.so "$GITHUB_WORKSPACE/build/webos/"
      - name: Packaging tool
        run: npm install -g @webos-tools/cli
      - name: Build and package
        run: ZIG="$(command -v zig)" tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stremio-family-ipk
          path: dist/*.ipk
      - name: Publish as the family-latest release
        run: |
          gh release delete kids-latest --yes --cleanup-tag 2>/dev/null || true
          gh release delete family-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create family-latest dist/*.ipk --target "$GITHUB_SHA" --prerelease \
            --title "Stremio Family (latest build)" --notes "Built automatically from the kids branch at $GITHUB_SHA."
